<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <title>Still Alive</title>
  <style>
    :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background:#000; color:#fff; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    body { display:flex; justify-content:center; align-items:stretch; min-height:100dvh; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
    main { width:min(100%,720px); min-height:100dvh; padding:max(28px,env(safe-area-inset-top)) 24px max(28px,env(safe-area-inset-bottom)); display:grid; grid-template-rows:auto 1fr auto; align-items:center; text-align:center; }
    h1 { margin:0; font-size:clamp(2.25rem,9vw,4.5rem); line-height:.95; letter-spacing:-.05em; font-weight:900; }
    #confirm { justify-self:center; width:min(72vw,360px); aspect-ratio:1; border:5px solid #fff; border-radius:50%; background:#fff; color:#000; font:inherit; font-size:clamp(2rem,9vw,4rem); line-height:.9; letter-spacing:-.04em; font-weight:900; text-transform:uppercase; cursor:pointer; outline:none; }
    #confirm:active { transform:scale(.96); background:#000; color:#fff; }
    .history { padding-bottom:2px; font-size:clamp(.95rem,3.7vw,1.2rem); line-height:1.35; }
    .history p { margin:0 0 8px; opacity:.7; }
    #elapsed { min-height:1.5em; font-size:clamp(1.1rem,4.7vw,1.55rem); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
    #aliveScreen { position:fixed; inset:0; display:none; place-items:center; background:#fff; color:#000; z-index:10; text-align:center; padding:28px; }
    #aliveScreen.show { display:grid; }
    #aliveWord { font-size:clamp(4rem,18vw,9rem); font-weight:900; letter-spacing:-.06em; }
    #sharePrompt { display:none; max-width:560px; }
    #sharePrompt.show { display:block; animation:fadeIn .3s linear; }
    #sharePrompt p { margin:0 0 28px; font-size:clamp(1.35rem,5vw,2.1rem); line-height:1.15; font-weight:800; }
    .choices { display:flex; justify-content:center; gap:18px; }
    .choices button { min-width:120px; padding:16px 24px; border:4px solid #000; background:#fff; color:#000; font:inherit; font-size:1.35rem; font-weight:900; }
    .choices button:active { background:#000; color:#fff; }
    @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  </style>
</head>
<body>
  <main>
    <h1>STILL ALIVE?</h1>
    <button id="confirm" type="button" aria-label="Confirm that you are still alive">PRESS<br>HERE</button>
    <section class="history" aria-live="polite">
      <p>Last time you confirmed yourself alive:</p>
      <div id="elapsed">UNCONFIRMED</div>
    </section>
  </main>

  <div id="aliveScreen" aria-hidden="true">
    <div id="aliveWord">ALIVE</div>
    <div id="sharePrompt">
      <p>Do you want to let your friends know you are still alive?</p>
      <div class="choices"><button id="yes" type="button">YES</button><button id="no" type="button">NO</button></div>
    </div>
  </div>

  <script>
    (() => {
      const STORAGE_KEY='stillAlive:lastConfirmed';
      const button=document.getElementById('confirm');
      const elapsed=document.getElementById('elapsed');
      const aliveScreen=document.getElementById('aliveScreen');
      const aliveWord=document.getElementById('aliveWord');
      const sharePrompt=document.getElementById('sharePrompt');
      const yes=document.getElementById('yes');
      const no=document.getElementById('no');
      let lastConfirmed=readSavedTime();
      let promptTimer=null;

      function readSavedTime(){ const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return null; const value=Number(raw); return Number.isFinite(value)&&value>0?value:null; }
      function plural(value,word){ return `${value} ${word}${value===1?'':'s'}`; }
      function render(){
        if(lastConfirmed===null){ elapsed.textContent='UNCONFIRMED'; return; }
        let seconds=Math.max(0,Math.floor((Date.now()-lastConfirmed)/1000));
        const days=Math.floor(seconds/86400); seconds%=86400;
        const hours=Math.floor(seconds/3600); seconds%=3600;
        const minutes=Math.floor(seconds/60); seconds%=60;
        elapsed.textContent=[plural(days,'day'),plural(hours,'hour'),plural(minutes,'minute'),plural(seconds,'second')].join(' ');
      }
      function closeAlive(){ clearTimeout(promptTimer); aliveScreen.classList.remove('show'); sharePrompt.classList.remove('show'); aliveWord.style.display='block'; aliveScreen.setAttribute('aria-hidden','true'); }
      function confirmAlive(){
        lastConfirmed=Date.now(); localStorage.setItem(STORAGE_KEY,String(lastConfirmed)); render();
        if(navigator.vibrate) navigator.vibrate(45);
        aliveScreen.classList.add('show'); aliveScreen.setAttribute('aria-hidden','false'); aliveWord.style.display='block'; sharePrompt.classList.remove('show');
        clearTimeout(promptTimer);
        promptTimer=setTimeout(()=>{ aliveWord.style.display='none'; sharePrompt.classList.add('show'); },1400);
      }
      function share(){
        if(window.StillAliveAndroid && typeof window.StillAliveAndroid.shareAlive==='function') window.StillAliveAndroid.shareAlive();
        else if(navigator.share) navigator.share({text:'I have confirmed that I am still alive.'}).catch(()=>{});
        closeAlive();
      }
      button.addEventListener('click',confirmAlive);
      yes.addEventListener('click',share);
      no.addEventListener('click',closeAlive);
      document.addEventListener('visibilitychange',()=>{ if(!document.hidden){ lastConfirmed=readSavedTime(); render(); } });
      render(); setInterval(render,250);
    })();
  </script>
</body>
</html>
